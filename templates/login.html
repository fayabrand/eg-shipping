<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EG Shipping - Login</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f0eff8;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 4px 32px rgba(83,74,183,.12)}.logo{display:flex;align-items:center;gap:12px;margin-bottom:2rem}.logo-icon{width:48px;height:48px;background:#534AB7;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}.logo-text{font-size:20px;font-weight:700;color:#1a1a2e}.logo-sub{font-size:12px;color:#888}label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:6px}input[type=password]{width:100%;height:44px;padding:0 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;outline:none;transition:border-color .2s}input[type=password]:focus{border-color:#534AB7}button{width:100%;height:44px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}button:hover{background:#3C3489}.error{background:#fff0f0;color:#c0392b;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;border:1px solid #f5c6c6}.hint{font-size:12px;color:#aaa;text-align:center;margin-top:14px}</style></head><body><div class="card"><div class="logo"><div class="logo-icon">📦</div><div><div class="logo-text">EG Shipping</div><div class="logo-sub">Receiving System</div></div></div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><label>Password</label><input type="password" name="password" placeholder="Enter system password" autofocus /><button type="submit">Sign in</button></form><div class="hint">USA · China · World → Egypt</div></div></body></html>
